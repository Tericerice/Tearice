<script>
'use strict';
var API = '', POLL_MS = 2000;
var allApps = [], currentTab = 'script';

// ── 日志状态 ──────────────────────────────────────────────
var sses = {};            // { appId: EventSource }
var logCategory = 'script'; // 当前日志分类：'web' | 'script'
var logFilter = 'all';    // 'all' | appId（当前分类内的过滤）
var autoScroll = true;    // true=跟随底部, false=用户手动滚上去了
var scrollHintCount = 0;  // 用户离开底部后新增的行数
var SCRIPT_COLORS = [
  '#10b981','#3b82f6','#f59e0b','#8b5cf6','#ec4899',
  '#06b6d4','#84cc16','#f97316','#6366f1','#14b8a6'
];
var colorIndex = 0;
var scriptColorMap = {};

function getColor(appId) {
  if (!scriptColorMap[appId]) {
    scriptColorMap[appId] = SCRIPT_COLORS[colorIndex % SCRIPT_COLORS.length];
    colorIndex++;
  }
  return scriptColorMap[appId];
}
function getAppName(appId) {
  var app = allApps.find(function(a){ return a.id === appId; });
  return app ? app.name : appId;
}
function getAppCategory(appId) {
  var app = allApps.find(function(a){ return a.id === appId; });
  return app ? app.category : null;
}

// ── 自动订阅管理 ──────────────────────────────────────────
function syncSubscriptions(apps) {
  var running = {};
  apps.forEach(function(a) {
    if (a.status === 'running') running[a.id] = true;
  });

  // 订阅所有运行中的应用（tool 类无日志，跳过订阅）
  apps.forEach(function(app) {
    if (app.category === 'tool') return;  // 快捷工具不需要日志
    if (app.status === 'running' && !sses[app.id]) {
      subscribeLog(app.id);
    }
    if (app.status !== 'running' && sses[app.id]) {
      unsubscribeLog(app.id);
    }
  });

  updateFilterTabs();
}

function subscribeLog(appId) {
  if (sses[appId]) return;
  appendLog(appId, {type: 'info', text: '--- 连接日志流 ---'});

  var url = API+'/api/logs/'+appId+'/stream';
  var es = new EventSource(url);
  sses[appId] = es;

  es.onmessage = function(evt) {
    try {
      var data = JSON.parse(evt.data);
      appendLog(appId, data);
    } catch(e) {}
  };
  es.onerror = function() {
    // EventSource 自动重连，不需要额外处理
  };
}

function unsubscribeLog(appId) {
  if (sses[appId]) {
    sses[appId].close();
    delete sses[appId];
  }
  // 不追加"取消订阅"日志，保持界面干净
}

// ── 追加日志行 ──────────────────────────────────────────────
function isLineVisible(appId) {
  var cat = getAppCategory(appId);
  if (cat !== logCategory) return false;
  if (logFilter !== 'all' && logFilter !== appId) return false;
  return true;
}

function appendLog(appId, data) {
  var container = document.getElementById('log-content');
  if (!container) return;

  var lineDiv = document.createElement('div');
  lineDiv.className = 'log-line';
  lineDiv.dataset.appId = appId;

  // 脚本名前缀标签
  var color = getColor(appId);
  var name = getAppName(appId);
  var tag = document.createElement('span');
  tag.className = 'tag-script';
  tag.style.cssText = 'background:'+color+'22; color:'+color+';';
  tag.textContent = name;
  lineDiv.appendChild(tag);

  var textSpan = document.createElement('span');
  textSpan.className = 'log-text';
  if (data.type === 'exit') textSpan.className += ' log-exit';
  else if (data.type === 'error') textSpan.className += ' log-error';
  else if (data.type !== 'log') textSpan.className += ' log-info';
  textSpan.textContent = data.text || '';
  lineDiv.appendChild(textSpan);

  // 根据当前分类+过滤决定是否可见
  lineDiv.style.display = isLineVisible(appId) ? '' : 'none';

  container.appendChild(lineDiv);

  // 限制 DOM 节点数量，防止 WebView2 渲染进程内存无限膨胀（最多保留 200 条）
  while (container.childElementCount > 200) {
    container.removeChild(container.firstElementChild);
  }

  if (autoScroll) {
    var terminal = document.getElementById('log-terminal');
    terminal.scrollTop = terminal.scrollHeight;
  } else {
    scrollHintCount++;
    showScrollHint();
  }
}

// ── 智能滚动：检测用户手动滚动行为 ────────────────────────
function isNearBottom() {
  var t = document.getElementById('log-terminal');
  return t.scrollHeight - t.scrollTop - t.clientHeight < 30;
}

function setupScrollDetection() {
  var terminal = document.getElementById('log-terminal');
  if (!terminal) return;
  terminal.addEventListener('scroll', function() {
    if (isNearBottom()) {
      if (!autoScroll) {
        autoScroll = true;
        scrollHintCount = 0;
        hideScrollHint();
      }
    } else if (autoScroll) {
      autoScroll = false;
      scrollHintCount = 0;
    }
  });
}

function showScrollHint() {
  var hint = document.getElementById('log-scroll-hint');
  if (!hint) return;
  hint.classList.remove('hidden');
  document.getElementById('scroll-hint-text').textContent =
    scrollHintCount + ' 条新日志';
}

function hideScrollHint() {
  var hint = document.getElementById('log-scroll-hint');
  if (hint) hint.classList.add('hidden');
}

function scrollToBottom() {
  autoScroll = true;
  scrollHintCount = 0;
  hideScrollHint();
  var terminal = document.getElementById('log-terminal');
  terminal.scrollTop = terminal.scrollHeight;
}

// DOM 就绪后绑定滚动检测
if (document.readyState !== 'loading') {
  setTimeout(setupScrollDetection, 100);
} else {
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(setupScrollDetection, 100);
  });
}

// ── 切换日志分类 ──────────────────────────────────────────
function switchLogCategory(cat) {
  if (cat === logCategory) return;
  logCategory = cat;
  logFilter = 'all';

  // 更新按钮样式
  document.querySelectorAll('.log-cat-btn').forEach(function(b) {
    if (b.dataset.logtab === cat) {
      b.className = b.className.replace(/bg-\w+-\d+/g, 'bg-emerald-700 text-white');
    } else {
      b.className = b.className.replace(/bg-\w+-\d+ text-white/g, 'bg-gray-800 text-gray-400');
    }
  });

  rebuildDisplay();
  updateFilterTabs();
}

// ── 过滤 ──────────────────────────────────────────────────
function setLogFilter(filter) {
  logFilter = filter;
  rebuildDisplay();
  updateFilterTabs();
}

function updateFilterTabs() {
  var container = document.getElementById('log-filters');
  if (!container) return;
  var html = '<button data-filter="all" onclick="setLogFilter(\'all\')" class="log-flt-btn px-1.5 py-0.5 rounded text-[10px] font-medium flex-shrink-0 ' +
    (logFilter==='all'?'bg-emerald-700 text-white':'bg-gray-800 text-gray-400') + '">全部</button>';

  // 只显示当前分类下正在运行的应用
  allApps.forEach(function(app) {
    if (app.status !== 'running') return;
    if (app.category !== logCategory) return;
    if (!sses[app.id]) return;  // 未订阅的不显示过滤
    var color = getColor(app.id);
    var ac = logFilter === app.id;
    html += '<button data-filter="'+app.id+'" onclick="setLogFilter(\''+app.id+'\')" class="log-flt-btn px-1.5 py-0.5 rounded text-[10px] font-medium flex-shrink-0" style="' +
      (ac ? 'background:'+color+';color:#fff;' : 'background:'+color+'22;color:'+color+';') + '">'+getAppName(app.id)+'</button>';
  });

  container.innerHTML = html;
}

function rebuildDisplay() {
  var container = document.getElementById('log-content');
  if (!container) return;
  for (var i = 0; i < container.children.length; i++) {
    var line = container.children[i];
    var appId = line.dataset.appId;
    if (!appId) {
      // 纯 info 行（无 data-appId）：仅"全部"可见
      line.style.display = (logFilter === 'all') ? '' : 'none';
      continue;
    }
    line.style.display = isLineVisible(appId) ? '' : 'none';
  }
}

// ── 工具函数 ──────────────────────────────────────────────
function clearLogs() {
  var c = document.getElementById('log-content');
  if (c) c.innerHTML = '<div class="log-line"><span class="log-text log-info">--- 日志已清空 ---</span></div>';
  scrollHintCount = 0;
  hideScrollHint();
}

function toast(msg, type) {
  type = type || 'info';
  var colors = { success:'bg-emerald-600', error:'bg-red-600', info:'bg-blue-600' };
  var icons  = { success:'\u2714', error:'\u2718', info:'\u2139' };
  var el = document.createElement('div');
  el.className = 'toast-enter px-4 py-3 rounded-lg text-white text-sm shadow-lg flex items-center gap-2 ' + (colors[type]||colors.info);
  var icon = document.createElement('span');
  icon.textContent = icons[type] || icons.info;
  var text = document.createElement('span');
  text.textContent = String(msg);
  el.appendChild(icon);
  el.appendChild(text);
  document.getElementById('toast-container').appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(function(){ el.remove() },300); }, 3500);
}

function fmtTime(ts) {
  if (!ts) return '--';
  var d = (Date.now()/1000) - ts;
  if (d<60) return Math.floor(d)+'s 前';
  if (d<3600) return Math.floor(d/60)+'min 前';
  return Math.floor(d/3600)+'h 前';
}
function fmtPid(p) { return p ? String(p) : '--'; }

// ── 渲染脚本列表（无日志按钮）─────────────────────────────
function renderScriptList(scripts) {
  var list = document.getElementById('script-list');
  var empty = document.getElementById('script-empty');
  if (!scripts.length) { list.innerHTML=''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  var html = '';
  scripts.forEach(function(app, i) {
    var on = app.status === 'running';
    var rowBg = on ? 'bg-emerald-950/20' : (i%2 ? 'bg-gray-900/50' : '');
    var dot = on ? 'bg-emerald-500 dot-pulse' : 'bg-gray-600';
    var stText = on ? '运行中' : '已停止';
    var stColor = on ? 'text-emerald-400' : 'text-gray-500';
    html += '<div class="px-3 py-2 border-b border-gray-800/30 '+rowBg+'"><div class="flex items-center gap-2">'+
      '<span class="w-6"><span class="w-2 h-2 rounded-full '+dot+' inline-block"></span></span>'+
      '<span class="flex-1 min-w-0"><span class="text-sm text-white font-medium truncate block">'+app.name+'</span>'+
      '</span>'+
      '<span class="w-16 text-center text-xs '+stColor+'">'+stText+'</span>'+
      '<span class="w-20 text-center text-[11px] text-gray-500 font-mono">'+(on?fmtPid(app.pid):'--')+'</span>'+
      '<span class="flex justify-end gap-1" style="flex-shrink:0">'+
        '<button data-action="start" data-id="'+app.id+'" class="px-2 py-0.5 rounded bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-medium transition-colors whitespace-nowrap">启动</button>'+
        '<button data-action="stop" data-id="'+app.id+'" class="px-2 py-0.5 rounded bg-red-600/80 hover:bg-red-500 text-white text-[11px] font-medium transition-colors whitespace-nowrap">停止</button>'+
      '</span>'+
      '</div><p class="text-[11px] text-gray-500 mt-2">'+app.description+'</p>'+
    '</div>';
  });
  list.innerHTML = html;
}

// ── 渲染工具卡片 ─────────────────────────────────────────
function renderToolCards() {
  var grid = document.getElementById('tool-grid');
  // ADB 扫码配对卡片（专属）
  var html = '<div class="rounded-lg bg-gradient-to-br from-gray-900 to-gray-900 border border-emerald-800/40 p-4 hover:border-emerald-700 transition-colors">'+
    '<div class="flex items-start justify-between mb-2">'+
      '<div><h3 class="font-semibold text-sm text-white">&#128247; ADB 扫码配对</h3>'+
        '<p class="text-xs text-gray-500 mt-1 line-clamp-2">Android 11+ 无线调试 · 手机扫 QR 码自动完成配对连接</p></div>'+
    '</div>'+
    '<button onclick="openAdbQrModal()" class="w-full mt-1 px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium transition-colors">&#128247; 开始扫码配对</button>'+
  '</div>';

  grid.innerHTML = html;
}

// ── 统计 ──────────────────────────────────────────────────
function updateStats(apps) {
  var total = apps.length, running = 0;
  for (var i=0;i<apps.length;i++) if (apps[i].status==='running') running++;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-running').textContent = running;
  document.getElementById('stat-stopped').textContent = total - running;
}

// ── 总渲染入口 ──────────────────────────────────────────────
function renderAll(apps) {
  allApps = apps;
  renderScriptList(apps.filter(function(a){return a.category==='script';}));
  renderToolCards(apps.filter(function(a){return a.category==='tool';}));
  updateStats(apps);

  // 自动订阅同步（运行中的自动订阅，停止的自动取消）
  syncSubscriptions(apps);

  // Tab 内容 + 按钮样式同步
  var tabs = ['script','tool'];
  tabs.forEach(function(t) {
    var el = document.getElementById('tab-'+t);
    if (!el) return;
    if (t === currentTab) el.classList.remove('hidden');
    else el.classList.add('hidden');
  });
  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.classList.toggle('is-active', b.dataset.tab === currentTab);
  });
}

// ── API ──────────────────────────────────────────────────
async function fetchApps() {
  try {
    var r = await fetch(API+'/api/apps');
    if (!r.ok) throw new Error('HTTP '+r.status);
    var d = await r.json();
    renderAll(d.apps);
  } catch(e) {}
}

async function doAction(action, appId, btn) {
  if (btn) { btn.disabled=true; btn.style.opacity='0.5'; }
  try {
    var r = await fetch(API+'/api/'+action+'/'+appId, {method:'POST'});
    var d = await r.json();
    if (r.ok && d.ok) toast(d.message, 'success');
    else toast(d.detail||d.message||'失败', 'error');
  } catch(e) { toast(e.message, 'error'); }
  if (btn) { btn.disabled=false; btn.style.opacity='1'; }
  await fetchApps();
}

// ── 事件委托 ──────────────────────────────────────────────
document.addEventListener('click', function(e) {
  var btn = e.target.closest('[data-action]');
  if (btn) {
    doAction(btn.dataset.action, btn.dataset.id, btn);
    return;
  }

  var tab = e.target.closest('.tab-btn');
  if (tab) {
    var t = tab.dataset.tab;
    if (t === currentTab) return;
    currentTab = t;
    renderAll(allApps);
  }
});

// ── 全部启动/停止（仅当前页） ─────────────────────────────
document.getElementById('btn-start-all').onclick = async function(){
  var b=this; b.disabled=true; b.textContent='启动中...';
  var targets = allApps.filter(function(a){ return a.category === currentTab && !a.one_shot && a.status !== 'running'; });
  if (!targets.length) { toast('当前页没有可启动的应用','info'); b.disabled=false; b.textContent='全部启动'; return; }
  var oks = 0, total = targets.length;
  for (var i=0;i<targets.length;i++) {
    try {
      var r = await fetch(API+'/api/start/'+targets[i].id, {method:'POST'});
      var d = await r.json();
      if (d.ok) oks++;
    } catch(e) { /* 单个失败不影响后续 */ }
    b.textContent = '启动中 '+(i+1)+'/'+total;
  }
  toast(oks+'/'+total+' 已启动', oks===total?'success':'error');
  b.disabled=false; b.textContent='全部启动';
  await fetchApps();
};
document.getElementById('btn-stop-all').onclick = async function(){
  var b=this; b.disabled=true; b.textContent='停止中...';
  var targets = allApps.filter(function(a){ return a.category === currentTab && a.status === 'running'; });
  if (!targets.length) { toast('当前页没有运行中的应用','info'); b.disabled=false; b.textContent='全部停止'; return; }
  var oks = 0, total = targets.length;
  for (var i=0;i<targets.length;i++) {
    try {
      var r = await fetch(API+'/api/stop/'+targets[i].id, {method:'POST'});
      var d = await r.json();
      if (d.ok) oks++;
    } catch(e) { /* 单个失败不影响后续 */ }
    b.textContent = '停止中 '+(i+1)+'/'+total;
  }
  toast(oks+'/'+total+' 已停止', oks===total?'success':'error');
  b.disabled=false; b.textContent='全部停止';
  await fetchApps();
};

// ── 时钟 ────────────────────────────────────────────────────
(function tick(){ document.getElementById('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false}); })();
setInterval(function(){ document.getElementById('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false}); },1000);

// ════════════════════════════════════════════════════════════
// ADB QR 扫码配对
// ════════════════════════════════════════════════════════════

var adbQrSessionId = null;
var adbQrPollTimer = null;
var adbQrDone = false;

function openAdbQrModal() {
  var modal = document.getElementById('adb-qr-modal');
  modal.style.display = 'flex';
  document.getElementById('adb-qr-status').textContent = '正在生成 QR 码...';
  document.getElementById('adb-qr-image-area').innerHTML =
    '<div id="adb-qr-placeholder" style="width:13rem;height:13rem;background:#fff;border-radius:0.5rem;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:0.75rem;">生成中...</div>';
  document.getElementById('adb-qr-details').style.display = 'none';
  var actions = document.getElementById('adb-qr-actions');
  actions.style.display = 'none';
  document.getElementById('adb-qr-connect-btn').style.display = 'none';
  adbQrDone = false;
  startAdbQrFlow();
}

function closeAdbQrModal() {
  document.getElementById('adb-qr-modal').style.display = 'none';
  stopAdbQrPoll();
  if (adbQrSessionId) {
    fetch(API+'/api/adb/qr-cancel/'+adbQrSessionId, {method:'POST'}).catch(function(){});
    adbQrSessionId = null;
  }
}

async function startAdbQrFlow() {
  try {
    var r = await fetch(API+'/api/adb/qr-generate', {method:'POST'});
    if (!r.ok) {
      var errText = await r.text().catch(function(){return '服务器错误'});
      throw new Error('HTTP '+r.status+': '+errText.substring(0,200));
    }
    var d = await r.json();
    if (!d.session_id) { throw new Error(d.detail||d.message||'生成失败'); }

    adbQrSessionId = d.session_id;

    // 显示 QR 码
    document.getElementById('adb-qr-image-area').innerHTML =
      '<img src="'+d.qr_image+'" class="w-52 h-52 rounded-lg" alt="ADB Pairing QR">';

    // 显示详情（可展开）
    var details = document.getElementById('adb-qr-details');
    details.innerHTML = '服务名: '+d.service_name+'<br>密码: '+d.password+'<br>数据: '+d.payload;
    details.style.display = '';

    document.getElementById('adb-qr-status').textContent = '请用手机扫描此 QR 码...';
    var actions = document.getElementById('adb-qr-actions');
    actions.style.display = '';

    // 开始轮询
    startAdbQrPoll();
  } catch(e) {
    document.getElementById('adb-qr-status').textContent = '生成失败: '+e.message;
  }
}

function startAdbQrPoll() {
  stopAdbQrPoll();
  adbQrPollTimer = setInterval(pollAdbQrStatus, 2000);
}

function stopAdbQrPoll() {
  if (adbQrPollTimer) { clearInterval(adbQrPollTimer); adbQrPollTimer = null; }
}

async function pollAdbQrStatus() {
  if (!adbQrSessionId || adbQrDone) return;

  try {
    var r = await fetch(API+'/api/adb/qr-poll/'+adbQrSessionId);
    var d = await r.json();

    var statusEl = document.getElementById('adb-qr-status');
    var connectBtn = document.getElementById('adb-qr-connect-btn');

    if (d.status === 'waiting') {
      statusEl.textContent = '请用手机扫描此 QR 码...';
      return;
    }

    if (d.status === 'paired') {
      statusEl.innerHTML = '<span style="color:#34d399;">&#10004; 配对成功！'+escapeHtml(d.message||'')+'</span>';
      adbQrDone = true;
      stopAdbQrPoll();

      // 配对成功后，延迟1秒自动尝试连接
      connectBtn.style.display = '';
      statusEl.textContent = '配对成功，正在尝试连接...';
      setTimeout(adbQrConnect, 1500);
      return;
    }

    if (d.status === 'pair_failed') {
      statusEl.innerHTML = '<span style="color:#f87171;">&#10008; 配对失败: '+escapeHtml(d.message||'')+'</span>';
      adbQrDone = true;
      stopAdbQrPoll();
      connectBtn.style.display = '';
      connectBtn.textContent = '重试配对';
      connectBtn.onclick = function(){ adbQrRetryPair(); };
      return;
    }

    if (d.status === 'connected') {
      statusEl.innerHTML = '<span style="color:#34d399;">&#10004; 连接成功！'+escapeHtml(d.message||'')+'</span>';
      adbQrDone = true;
      stopAdbQrPoll();
      connectBtn.style.display = '';
      connectBtn.textContent = '完成';
      connectBtn.style.background = '#059669';
      connectBtn.style.color = '#fff';
      connectBtn.onclick = closeAdbQrModal;
      toast('ADB 设备连接成功！', 'success');
      return;
    }

    if (d.status === 'expired') {
      statusEl.textContent = '会话已过期，请重新扫码';
      adbQrDone = true;
      stopAdbQrPoll();
    }
  } catch(e) {
    // 网络错误时静默重试
  }
}

async function adbQrConnect() {
  if (!adbQrSessionId) return;
  var statusEl = document.getElementById('adb-qr-status');
  var connectBtn = document.getElementById('adb-qr-connect-btn');
  connectBtn.disabled = true;
  connectBtn.textContent = '连接中...';

  try {
    var r = await fetch(API+'/api/adb/qr-connect/'+adbQrSessionId, {method:'POST'});
    var d = await r.json();
    if (d.ok) {
      statusEl.innerHTML = '<span style="color:#34d399;">&#10004; 连接成功！</span>';
      toast('ADB 设备连接成功！', 'success');
      connectBtn.textContent = '完成';
      connectBtn.style.background = '#059669';
      connectBtn.style.color = '#fff';
      connectBtn.onclick = closeAdbQrModal;
    } else {
      statusEl.innerHTML = '<span style="color:#f87171;">&#10008; 连接失败: '+escapeHtml(d.message||'')+'</span>';
      connectBtn.textContent = '重试连接';
      connectBtn.onclick = adbQrConnect;
    }
  } catch(e) {
    statusEl.innerHTML = '<span style="color:#f87171;">&#10008; 连接异常: '+escapeHtml(e.message)+'</span>';
  }
  connectBtn.disabled = false;
}

function adbQrRetryPair() {
  // 重新生成新的 QR
  closeAdbQrModal();
  setTimeout(openAdbQrModal, 500);
}

function adbQrCancel() {
  closeAdbQrModal();
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 启动 ────────────────────────────────────────────────────
fetchApps();
setInterval(fetchApps, POLL_MS);
</script>

    <div id="adb-qr-status" style="font-size:0.75rem;text-align:center;color:#9ca3af;margin-bottom:0.5rem;">等待生成...</div>

    <!-- 配对详情 -->
    <div id="adb-qr-details" class="hidden" style="margin-bottom:0.75rem;padding:0.5rem;border-radius:0.375rem;background:#1f2937;font-size:0.625rem;font-family:'Cascadia Code','Consolas',monospace;color:#6b7280;word-break:break-all;"></div>

    <!-- 操作按钮 -->
    <div id="adb-qr-actions" class="hidden" style="display:none; gap:0.5rem;">
      <button onclick="adbQrCancel()" style="flex:1;padding:0.25rem 0.5rem;border-radius:0.375rem;background:#374141;color:#d1d5db;font-size:0.75rem;cursor:pointer;border:none;">取消</button>
      <button onclick="adbQrConnect()" id="adb-qr-connect-btn" class="hidden" style="flex:1;padding:0.25rem 0.5rem;border-radius:0.375rem;background:#059669;color:#fff;font-size:0.75rem;cursor:pointer;border:none;">执行连接</button>
    </div>

    <!-- 使用说明 -->
    <div style="margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid #1f2937;font-size:0.625rem;color:#4b5563;line-height:1.625;">
      1. 手机开启「开发者选项 &rarr; 无线调试」<br>
      2. 点击「使用配对码配对」旁边的 QR 图标<br>
      3. 扫描此 QR 码，大管家自动完成配对连接
    </div>
  </div>
</div>

</body>
</html>
